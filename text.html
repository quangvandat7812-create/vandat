<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Gửi Qa 💖</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(270deg, #ff4d6d, #ff758f, #ffb3c6);
    background-size: 600% 600%;
    animation: bg 10s ease infinite;
    text-align: center;
    color: white;
    overflow: hidden;
}

@keyframes bg {
    0% {background-position: 0%;}
    50% {background-position: 100%;}
    100% {background-position: 0%;}
}

.container {
    margin-top: 50px;
}

/* ảnh */
img {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 4px solid white;
    box-shadow: 0 0 25px pink;
    object-fit: cover;
    animation: zoom 4s ease-in-out infinite;
}

@keyframes zoom {
    0%,100% {transform: scale(1);}
    50% {transform: scale(1.1);}
}

h1 {
    margin-top: 20px;
}

/* typing */
.typing {
    font-size: 22px;
    border-right: 2px solid white;
    display: inline-block;
    white-space: nowrap;
    overflow: hidden;
    width: 0;
    animation: typing 4s steps(40) forwards, blink 1s infinite;
}

@keyframes typing {
    to {width: 100%;}
}

@keyframes blink {
    50% {border-color: transparent;}
}

/* buttons */
.buttons button {
    margin: 10px;
    padding: 12px 20px;
    border: none;
    border-radius: 12px;
    background: #ff1e4d;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.buttons button:hover {
    transform: scale(1.1);
    background: #ff4d6d;
}

/* popup thư */
.popup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
}

.popup-content {
    background: white;
    color: black;
    padding: 20px;
    border-radius: 15px;
    width: 300px;
    text-align: center;
}

/* tim bay */
.heart {
    position: fixed;
    bottom: -10px;
    animation: fly 6s linear infinite;
}

@keyframes fly {
    0% {transform: translateY(0); opacity: 1;}
    100% {transform: translateY(-100vh); opacity: 0;}
}
</style>

</head>

<body>

<div class="container">

    <a href="https://ibb.co/B5FJw0ph"><img src="https://i.ibb.co/B5FJw0ph/vd12.jpg" alt="vd12" border="0" /></a>

    <h1>💖 Gửi Qa 💖</h1>

    <div class="typing">
        Nhớ em quá rồi... yêu em nhiều lắm 💕
    </div>

    <div class="buttons">
        <br>
        <button onclick="love()">💖 Yêu em</button>
        <button onclick="openLetter()">💌 Thư bí mật</button>
        <button onclick="playMusic()">🎵 Bật Nhạc</button>
    </div>

</div>

<!-- popup -->
<div class="popup" id="popup">
    <div class="popup-content">
        <h3>💌 Gửi em</h3>
        <p>Anh nhớ em nhiều lắm...<br>Luôn bên nhau nhé 💕</p>
        <button onclick="closeLetter()">Đóng</button>
    </div>
</div>

<script>
function love() {
    alert("Anh yêu em nhìu lém💖");
}

function openLetter() {
    document.getElementById("popup").style.display = "flex";
}

function closeLetter() {
    document.getElementById("popup").style.display = "none";
}

function changeBg() {
    document.body.style.background =
    "linear-gradient(270deg, #6a11cb, #2575fc)";
}

function playMusic() {
    let audio = new Audio("https://files.catbox.moe/9jr59f.mp3");
    audio.play();
}

/* tim bay */
setInterval(() => {
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 20) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
}, 250);
</script>

</body>

</script>
